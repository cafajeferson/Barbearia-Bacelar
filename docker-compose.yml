# Deploy da Fase 10 na VPS Hostinger KVM2 — SEM Coolify (a VPS já hospeda
# outros dois sites via nginx do sistema + Certbot; o instalador padrão do
# Coolify tomaria as portas 80/443 pra si e derrubaria eles). O nginx já
# existente na VPS faz o proxy reverso pra este container, num bloco de
# site novo (ver deploy/nginx.example.conf e deploy/GUIA-DEPLOY.md passo 8).
# Postgres/Auth/Storage do APP ficam no Supabase Cloud, fora deste compose
# — o "postgres" aqui embaixo é só pro estado interno da Evolution API
# (instâncias/histórico de mensagens), que essa versão exige de verdade
# (não tem mais um modo "sem banco", ao contrário do que a doc mais antiga
# sugeria) — completamente separado dos dados da barbearia.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Só localhost — quem expõe ao público é o nginx do sistema, não o
      # Docker diretamente (porta livre nesta VPS: 5000 já é de outro site).
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.production
    depends_on:
      - evolution-api

  evolution-api:
    # Nome/organização da imagem mudou (era atendai/evolution-api) — confira
    # https://github.com/evolution-foundation/evolution-api se este pull
    # voltar a falhar no futuro, o projeto pode migrar de novo.
    image: evoapicloud/evolution-api:latest
    restart: unless-stopped
    ports:
      # Só pro pareamento inicial via QR code (painel/API da Evolution) —
      # pode comentar depois de parear, já que o app fala com ela pela rede
      # interna do compose (EVOLUTION_API_URL=http://evolution-api:8080).
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      # Mesma chave de EVOLUTION_API_KEY no .env.production — via
      # substituição de variável do compose, não hardcoded. Rode com
      # `docker compose --env-file .env.production up -d --build`.
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - QRCODE_LIMIT=5
    depends_on:
      evolution-db:
        condition: service_healthy

  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD}
      - POSTGRES_DB=evolution
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  evolution_instances:
  evolution_db_data:
