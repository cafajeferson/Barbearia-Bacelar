# Deploy da Fase 10 na VPS Hostinger KVM2 — SEM Coolify (a VPS já hospeda
# outros dois sites via nginx do sistema + Certbot; o instalador padrão do
# Coolify tomaria as portas 80/443 pra si e derrubaria eles). O nginx já
# existente na VPS faz o proxy reverso pra este container, num bloco de
# site novo (ver deploy/nginx.example.conf e deploy/GUIA-DEPLOY.md passo 8).
# Postgres/Auth/Storage ficam no Supabase Cloud, fora deste compose.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Só localhost — quem expõe ao público é o nginx do sistema, não o
      # Docker diretamente (porta livre nesta VPS: 5000 já é de outro site).
      - "127.0.0.1:3001:3000"
    env_file:
      - .env.production
    depends_on:
      - evolution-api

  evolution-api:
    image: atendai/evolution-api:latest
    restart: unless-stopped
    ports:
      # Só pro pareamento inicial via QR code (painel/API da Evolution) —
      # pode comentar depois de parear, já que o app fala com ela pela rede
      # interna do compose (EVOLUTION_API_URL=http://evolution-api:8080).
      - "127.0.0.1:8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      # Mesma chave usada em EVOLUTION_API_KEY no .env.production do app.
      - AUTHENTICATION_API_KEY=troque-esta-chave-por-uma-gerada-com-openssl-rand-hex-32
      - DATABASE_ENABLED=false
      - CACHE_REDIS_ENABLED=false
      - QRCODE_LIMIT=5

volumes:
  evolution_instances:
