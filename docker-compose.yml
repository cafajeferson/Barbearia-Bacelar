# Deploy da Fase 10 na VPS Hostinger KVM2, gerenciado pelo Coolify. Coolify
# cuida do proxy reverso (Traefik) e do certificado SSL automaticamente a
# partir do domínio configurado no painel — não precisa dos labels do
# Traefik aqui. Postgres/Auth/Storage/Realtime ficam no Supabase Cloud
# (fora deste compose, propositalmente: só o app Next.js e a Evolution API
# rodam na VPS).
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    depends_on:
      - evolution-api

  evolution-api:
    image: atendai/evolution-api:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - evolution_instances:/evolution/instances
    environment:
      # AUTHENTICATION_API_KEY é a mesma chave usada em EVOLUTION_API_KEY no
      # .env.production do app — troque o valor abaixo (ou melhor, mova pra
      # .env.production e referencie via ${EVOLUTION_API_KEY} nas duas envs).
      - AUTHENTICATION_API_KEY=troque-esta-chave-por-uma-gerada-com-openssl-rand-hex-32
      - DATABASE_ENABLED=false
      - CACHE_REDIS_ENABLED=false
      - QRCODE_LIMIT=5

volumes:
  evolution_instances:
