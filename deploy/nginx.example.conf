# Exemplo de proxy reverso Nginx — SÓ necessário se você optar por não usar
# o Coolify (que já resolve isso automaticamente via Traefik + Let's
# Encrypt). Guarde como referência ou como fallback caso troque de
# gerenciador de containers no futuro.
#
# Uso: troque "seudominio.com.br" pelo domínio real, coloque em
# /etc/nginx/sites-available/barbearia-bacelar, link em sites-enabled, e
# rode `certbot --nginx -d seudominio.com.br` pra emitir o certificado.

server {
    listen 80;
    server_name seudominio.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name seudominio.com.br;

    # Preenchido pelo certbot na primeira emissão — não edite à mão.
    ssl_certificate     /etc/letsencrypt/live/seudominio.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/seudominio.com.br/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
